name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Swift test and Release app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          uname -m
      - name: Swift tests
        run: swift test --parallel --num-workers 1
      - name: Release App bundle
        run: scripts/build_app.sh
      - name: Whitespace check
        run: git diff --check
