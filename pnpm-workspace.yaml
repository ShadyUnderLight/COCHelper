packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted
engineStrict: false
# Electron Forge 7 的 @electron/rebuild 仍通过 git 解析 @electron/node-gyp。
# Forge 8 修复前必须关闭，否则无法安装宿主。
blockExoticSubdeps: false
# appdmg 的 fs-xattr/macos-alias 带 binding.gyp 但没有可被 pnpm 自动执行的 install hook；
# allowBuilds 只保证 clean install 不被 pnpm 阻断，release:prepare 会显式 node-gyp rebuild macos-alias。
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
