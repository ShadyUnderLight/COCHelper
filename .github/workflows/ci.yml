name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Swift test and Release app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          uname -m
      - name: Swift tests
        run: swift test --parallel --num-workers 1
      - name: Release App bundle
        run: scripts/build_app.sh
      - name: Whitespace check against main
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD

  electron:
    name: Electron bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Show toolchain
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Security scans
        run: |
          pnpm check:renderer-isolation
          pnpm check:secrets
      - name: Package
        run: pnpm package
      - name: Packaged smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 || sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
          xvfb-run --auto-servernum pnpm smoke
      - name: Renderer isolation on webpack output
        run: pnpm check:renderer-isolation

  electron-macos:
    name: Electron packaged macOS smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm package
      - name: Packaged .app smoke
        run: pnpm smoke
