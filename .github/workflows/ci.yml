name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Swift test and Release app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          uname -m
      - name: Swift tests
        run: swift test --parallel --num-workers 1
      - name: Release App bundle
        run: scripts/build_app.sh
      - name: Whitespace check against main
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
